// Real-website replacement for the Claude-artifact "window.storage" API,
// backed by the browser's own localStorage so progress is saved on THIS device.
window.storage = {
  async get(key, shared) {
    const raw = localStorage.getItem("kv_" + key);
    if (raw === null) return null;
    return { key, value: raw, shared: !!shared };
  },
  async set(key, value, shared) {
    localStorage.setItem("kv_" + key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    localStorage.removeItem("kv_" + key);
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage)
      .filter((k) => k.startsWith("kv_" + (prefix || "")))
      .map((k) => k.slice(3));
    return { keys };
  },
};
</script>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  const [quizWrongIds, setQuizWrongIds] = useState(() => new Set());

  const allWords = useMemo(() => [...SEED_WORDS, ...customWords], [customWords]);
  const allCategories = useMemo(() => [...CATEGORIES, ...customCategories], [customCategories]);

  // ---- load persisted state -------------------------------------------------
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setProgress(parsed.progress || {});
          setCustomWords((parsed.custom || []).map((w) => ({ ...w, custom: true })));
          setCustomCategories(parsed.customCategories || []);
          if (["en", "vi", "ko"].includes(parsed.lang)) setLang(parsed.lang);
          const st = parsed.streak || { lastDate: null, count: 0 };
          const today = todayStr();
          const yest = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
          if (st.lastDate === today) {
            setStreak(st);
          } else if (st.lastDate === yest) {
            setStreak({ lastDate: today, count: st.count + 1 });
          } else if (st.lastDate) {
            setStreak({ lastDate: today, count: 1 });
          } else {
            setStreak({ lastDate: today, count: 1 });
          }
        } else {
          setStreak({ lastDate: todayStr(), count: 1 });
        }
      } catch (e) {
        setStreak({ lastDate: todayStr(), count: 1 });
      }
      setReady(true);
    })();
  }, []);

  const persist = useCallback((next) => {
    window.storage.set(STORAGE_KEY, JSON.stringify(next), false).catch(() => {});
  }, []);

  useEffect(() => {
    if (!ready) return;
    persist({
      progress,
      custom: customWords.map(({ custom, ...rest }) => rest),
      customCategories,
      streak,
      lang,
    });
  }, [progress, customWords, customCategories, streak, lang, ready, persist]);

  // ---- build a study round ---------------------------------------------------
  const buildQueue = useCallback(
    (catId) => {
      const pool = catId === "all" ? allWords : allWords.filter((w) => w.category === catId);
      const review = pool.filter((w) => progress[w.id]?.status === "review");
      const fresh = pool.filter((w) => !progress[w.id]);
      const known = pool.filter((w) => progress[w.id]?.status === "know");
      const ordered = [...shuffle(review), ...shuffle(fresh), ...shuffle(known)];
      return ordered.length ? ordered : shuffle(pool);
    },
    [allWords, progress]
  );

  const startRound = useCallback(
    (catId) => {
      const words = buildQueue(catId);
      setRoundOrder(words);
      setMarks({});
      setPosition(0);
      setRoundDone(false);
      setFlipped(false);
    },
    [buildQueue]
  );

  useEffect(() => {
    if (!ready || activeCat === null) return;
    startRound(activeCat);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [ready, activeCat, customWords.length]);

  const current = roundOrder[position];
  const roundTotal = roundOrder.length;
  const remainingCount = roundOrder.filter((w) => marks[w.id] !== "know").length;

  // find the next position at/after `from` that isn't already marked "know" in this round
  const findNextOpen = useCallback(
    (from, marksMap) => {
      let p = from;
      while (p < roundOrder.length && marksMap[roundOrder[p].id] === "know") p++;
      return p;
    },
    [roundOrder]
  );

  const goNext = useCallback(() => {
    setFlipped(false);
    setPosition((p) => {
      const next = findNextOpen(p + 1, marks);
      if (next >= roundOrder.length) {
        setRoundDone(true);
        return p;
      }
      return next;
    });
  }, [findNextOpen, marks, roundOrder.length]);

  // "이전" always steps back one position in the fixed order, so every card the
  // person has already answered — known or not — stays reachable, all the way to the start.
  const goPrev = useCallback(() => {
    setFlipped(false);
    setRoundDone(false);
    setPosition((p) => Math.max(0, p - 1));
  }, []);

  const mark = (status) => {
    if (!current) return;
    const word = current;
    const nextMarks = { ...marks, [word.id]: status };

    // if the person got it wrong, pull this word a few cards closer so it
    // resurfaces again soon in THIS same round, instead of only next round
    let nextOrder = roundOrder;
    if (status === "review") {
      const insertAt = Math.min(roundOrder.length, position + 4);
      nextOrder = [...roundOrder];
      nextOrder.splice(insertAt, 0, word);
    }

    setMarks(nextMarks);
    if (nextOrder !== roundOrder) setRoundOrder(nextOrder);
    setProgress((p) => ({
      ...p,
      [word.id]: { ...(p[word.id] || {}), status, seen: (p[word.id]?.seen || 0) + 1 },
    }));
    setToast(status === "know" ? t("toastKnow") : t("toastReview"));
    setTimeout(() => setToast(null), 900);
    setFlipped(false);

    setTimeout(() => {
      let p = position + 1;
      while (p < nextOrder.length && nextMarks[nextOrder[p].id] === "know") p++;
      if (p >= nextOrder.length) {
        setRoundDone(true);
      } else {
        setPosition(p);
      }
    }, 220);
  };

  // records a wrong attempt on the current word — in typing/quiz mode the
  // person must keep answering the SAME word until they get it right
  const registerMistake = (word) => {
    if (!word) return;
    setAttemptMistakes((m) => m + 1);
    setProgress((p) => ({
      ...p,
      [word.id]: { ...(p[word.id] || {}), mistakes: (p[word.id]?.mistakes || 0) + 1 },
    }));
  };

  // called once the person finally answers the current word correctly
  const completeCorrectAnswer = () => {
    const finalStatus = attemptMistakes > 0 ? "review" : "know";
    mark(finalStatus);
  };

  const submitTyping = () => {
    if (!current) return;
    const isCorrect = typedAnswer.trim() === current.hangul.trim();
    if (isCorrect) {
      setTypingFeedback(null);
      completeCorrectAnswer();
    } else {
      registerMistake(current);
      setTypingFeedback("wrong");
      setTypedAnswer("");
      setTimeout(() => setTypingFeedback(null), 900);
    }
  };

  const selectQuizOption = (opt) => {
    if (!current || quizWrongIds.has(opt.id)) return;
    if (opt.id === current.id) {
      completeCorrectAnswer();
    } else {
      registerMistake(current);
      setQuizWrongIds((prev) => new Set(prev).add(opt.id));
    }
  };

  // reset the ephemeral practice-mode state whenever the word or mode changes
  useEffect(() => {
    setAttemptMistakes(0);
    setTypedAnswer("");
    setTypingFeedback(null);
    setQuizWrongIds(new Set());
    if (studyMode === "quiz" && current) {
      const distractPool = allWords.filter((w) => w.id !== current.id);
      const distractors = shuffle(distractPool).slice(0, 3);
      const options = shuffle([
        { id: current.id, text: meaningOf(current) },
        ...distractors.map((w) => ({ id: w.id, text: meaningOf(w) })),
      ]);
      setQuizOptions(options);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [current?.id, studyMode, lang]);

  const catStats = (catId) => {
    const pool = catId === "all" ? allWords : allWords.filter((w) => w.category === catId);
    const known = pool.filter((w) => progress[w.id]?.status === "know").length;
    return { known, total: pool.length };
  };

  const overall = catStats("all");

  // ---- add word form ---------------------------------------------------------
  const [form, setForm] = useState({
    category: "daily",
    hangul: "",
    romanization: "",
    meaning: "",
    meaningEn: "",
    example: "",
    exampleMeaning: "",
    exampleMeaningEn: "",
  });
  const [newCategoryName, setNewCategoryName] = useState("");
  const submitWord = (e) => {
    e.preventDefault();
    if (!form.hangul.trim() || !(form.meaning.trim() || form.meaningEn.trim())) return;

    let categoryId = form.category;
    if (categoryId === "__new__") {
      const name = newCategoryName.trim();
      if (!name) return; // need a name to create the category
      const slug = `custom_${name
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "") || Date.now()}`;
      const existing = customCategories.find((c) => c.label === name);
      if (existing) {
        categoryId = existing.id;
      } else {
        categoryId = slug;
        setCustomCategories((cats) => [...cats, { id: slug, label: name, sub: name, subEn: name }]);
      }
    }

    const w = {
      id: `c${Date.now()}`,
      ...form,
      category: categoryId,
      meaning: form.meaning.trim() || form.meaningEn,
      meaningEn: form.meaningEn.trim() || form.meaning,
      exampleMeaning: form.exampleMeaning.trim() || form.exampleMeaningEn,
      exampleMeaningEn: form.exampleMeaningEn.trim() || form.exampleMeaning,
      custom: true,
    };
    setCustomWords((c) => [...c, w]);
    setForm({
      category: categoryId,
      hangul: "",
      romanization: "",
      meaning: "",
      meaningEn: "",
      example: "",
      exampleMeaning: "",
      exampleMeaningEn: "",
    });
    setNewCategoryName("");
    setToast(t("toastAdded"));
    setTimeout(() => setToast(null), 900);
  };

  const catLabel = (id) => allCategories.find((c) => c.id === id)?.label || id;
  const catSub = (id) => {
    const c = allCategories.find((c) => c.id === id);
    if (!c) return "";
    if (lang === "ko") return c.label; // category names are already Korean
    return lang === "en" ? c.subEn ?? c.sub : c.sub;
  };
  const meaningOf = (w) => {
    if (!w) return "";
    if (lang === "ko") return w.meaningEn || w.meaning; // Koreans read the EN/VI gloss to learn those languages
    return lang === "en" ? w.meaningEn || w.meaning : w.meaning;
  };
  const exampleMeaningOf = (w) => {
    if (!w) return "";
    if (lang === "ko") return w.exampleMeaningEn || w.exampleMeaning;
    return lang === "en" ? w.exampleMeaningEn || w.exampleMeaning : w.exampleMeaning;
  };
  const t = (key) => UI_TEXT[lang][key] ?? UI_TEXT.vi[key] ?? key;

  const speak = useCallback((text) => {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR";
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    } catch (e) {
      /* speech synthesis unavailable */
    }
  }, []);

  if (!ready) {
    return (
      <div style={{ ...styles.app, alignItems: "center", justifyContent: "center" }}>
        <div style={{ color: "#C9A24B", fontFamily: "'Noto Sans KR', sans-serif" }}>{t("loading")}</div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        .kv-tab { transition: color .15s ease, border-color .15s ease; }
        .kv-tab:hover { color: #F0E9D8; }
        .kv-btn { transition: transform .1s ease, background .15s ease; }
        .kv-btn:active { transform: scale(0.97); }
        .kv-card-face { backface-visibility: hidden; }
        .kv-scroll::-webkit-scrollbar { width: 6px; }
        .kv-scroll::-webkit-scrollbar-thumb { background: #3A4150; border-radius: 3px; }
      `}</style>

      <header style={styles.header}>
        <div>
          <div style={styles.brand}>단어장</div>
          <div style={styles.brandSub}>{t("brandSub")}</div>
        </div>
        <div style={styles.headerRight}>
          <div style={styles.langToggle}>
            {["vi", "en", "ko"].map((l) => (
              <button
                key={l}
                className="kv-btn"
                onClick={() => setLang(l)}
                style={{
                  ...styles.langBtn,
                  background: lang === l ? GOLD : "transparent",
                  color: lang === l ? "#22252A" : MUTE,
                }}
              >
                {l.toUpperCase()}
              </button>
            ))}
          </div>
          <div style={styles.streakBox}>
            <div style={styles.streakNum}>{streak.count}</div>
            <div style={styles.streakLabel}>{t("streakLabel")}</div>
          </div>
        </div>
      </header>

      <nav style={styles.nav}>
        {["study", "browse", "add"].map((v) => (
          <button
            key={v}
            className="kv-tab"
            onClick={() => setView(v)}
            style={{
              ...styles.navBtn,
              color: view === v ? "#F0E9D8" : "#8A93A3",
              borderBottom: view === v ? "2px solid #A8412F" : "2px solid transparent",
            }}
          >
            {v === "study" ? t("tabStudy") : v === "browse" ? t("tabBrowse") : t("tabAdd")}
          </button>
        ))}
      </nav>

      {view === "study" && activeCat === null && (
        <div style={styles.body}>
          <div style={styles.folderGrid}>
            <button className="kv-btn" onClick={() => setActiveCat("all")} style={styles.folderCard}>
              <div style={styles.folderIcon}>📚</div>
              <div style={styles.folderLabel}>{t("allChip")}</div>
              <div style={styles.folderCount}>
                {overall.known}/{overall.total}
              </div>
            </button>
            {allCategories.map((c) => {
              const s = catStats(c.id);
              return (
                <button key={c.id} className="kv-btn" onClick={() => setActiveCat(c.id)} style={styles.folderCard}>
                  <div style={styles.folderIcon}>{c.label.slice(0, 1)}</div>
                  <div style={styles.folderLabel}>{catSub(c.id)}</div>
                  <div style={styles.folderSubKorean}>{c.label}</div>
                  <div style={styles.folderCount}>
                    {s.known}/{s.total}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {view === "study" && activeCat !== null && (
        <div style={styles.body}>
          <div style={styles.catHeaderRow}>
            <button className="kv-btn" style={styles.backToFoldersBtn} onClick={() => setActiveCat(null)}>
              {lang === "ko" ? "◀ 카테고리" : lang === "en" ? "◀ Categories" : "◀ Danh mục"}
            </button>
            <div style={styles.catHeaderTitle}>
              {activeCat === "all" ? t("allChip") : catSub(activeCat)}
            </div>
          </div>

          <div style={styles.modeRow}>
            {["flashcard", "typing", "quiz"].map((m) => (
              <button
                key={m}
                className="kv-btn"
                onClick={() => setStudyMode(m)}
                style={{ ...styles.modeBtn, ...(studyMode === m ? styles.modeBtnActive : {}) }}
              >
                {m === "flashcard" ? t("modeFlashcard") : m === "typing" ? t("modeTyping") : t("modeQuiz")}
              </button>
            ))}
          </div>

          {roundTotal === 0 ? (
            <div style={styles.empty}>{t("emptyMsg")}</div>
          ) : roundDone ? (
            <div style={styles.doneWrap}>
              {remainingCount === 0 ? (
                <>
                  <div style={styles.doneEmoji}>🎉</div>
                  <div style={styles.doneTitle}>{t("doneCongratsTitle")}</div>
                  <div style={styles.doneText}>
                    {t("doneCongratsText")(activeCat === "all" ? t("allCategoryName") : catSub(activeCat))}
                  </div>
                </>
              ) : (
                <>
                  <div style={styles.doneEmoji}>✅</div>
                  <div style={styles.doneTitle}>{t("doneRoundTitle")}</div>
                  <div style={styles.doneText}>{t("doneRoundText")(roundTotal - remainingCount, remainingCount)}</div>
                </>
              )}
              <div style={styles.doneActions}>
                <button className="kv-btn" style={styles.navArrowBtn} onClick={goPrev}>
                  {t("prevCardAgainBtn")}
                </button>
                <button className="kv-btn" style={styles.restartBtn} onClick={() => startRound(activeCat)}>
                  {t("restartBtn")}
                </button>
              </div>
            </div>
          ) : current ? (
            <>
              {progress[current.id]?.mistakes > 0 && (
                <div style={styles.mistakeBadge}>{t("mistakesBadge")(progress[current.id].mistakes)}</div>
              )}

              {studyMode === "flashcard" && (
                <div style={styles.cardWrap}>
                  <div
                    onClick={() => setFlipped((f) => !f)}
                    style={{
                      ...styles.card,
                      transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
                    }}
                  >
                    <div className="kv-card-face" style={{ ...styles.cardFace }}>
                      <div style={styles.seal}>{catLabel(current.category).slice(0, 2)}</div>
                      {marks[current.id] && (
                        <div style={styles.reviewedTag}>
                          {marks[current.id] === "know" ? t("alreadyKnownTag") : t("markedReviewTag")}
                        </div>
                      )}
                      <button
                        className="kv-btn"
                        style={styles.speakBtn}
                        onClick={(e) => {
                          e.stopPropagation();
                          speak(current.hangul);
                        }}
                        aria-label={t("speakWord")}
                      >
                        <Volume2 size={18} />
                      </button>
                      <div style={styles.hangul}>{current.hangul}</div>
                      <div style={styles.romanization}>{current.romanization}</div>
                      <div style={styles.tapHint}>{t("tapHint")}</div>
                    </div>
                    <div className="kv-card-face" style={{ ...styles.cardFace, ...styles.cardBack }}>
                      <button
                        className="kv-btn"
                        style={styles.speakBtn}
                        onClick={(e) => {
                          e.stopPropagation();
                          speak(current.example || current.hangul);
                        }}
                        aria-label={t("speakExample")}
                      >
                        <Volume2 size={18} />
                      </button>
                      <div style={styles.meaning}>{meaningOf(current)}</div>
                      <div style={styles.exampleKo}>{current.example}</div>
                      <div style={styles.exampleVi}>{exampleMeaningOf(current)}</div>
                    </div>
                  </div>
                </div>
              )}

              {studyMode === "typing" && (
                <div style={styles.practiceWrap}>
                  {marks[current.id] && (
                    <div style={styles.reviewedTagStatic}>
                      {marks[current.id] === "know" ? t("alreadyKnownTag") : t("markedReviewTag")}
                    </div>
                  )}
                  <div style={styles.practicePrompt}>{t("typingPrompt")}</div>
                  <div style={styles.practiceMeaning}>{meaningOf(current)}</div>
                  <input
                    key={current.id}
                    value={typedAnswer}
                    onChange={(e) => setTypedAnswer(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") {
                        e.preventDefault();
                        submitTyping();
                      }
                    }}
                    style={{
                      ...styles.typingInput,
                      borderColor: typingFeedback === "wrong" ? SEAL : "#333B49",
                    }}
                    placeholder={t("typingPlaceholder")}
                    autoFocus
                  />
                  {typingFeedback === "wrong" && <div style={styles.wrongFeedback}>{t("wrongTryAgain")}</div>}
                  {attemptMistakes > 0 && (
                    <div style={styles.hintText}>
                      {t("romanizationHintLabel")}: {current.romanization}
                    </div>
                  )}
                  <button className="kv-btn" style={styles.submitBtn} onClick={submitTyping}>
                    {t("checkBtn")}
                  </button>
                  <button
                    className="kv-btn"
                    style={styles.speakBtnInline}
                    onClick={() => speak(current.hangul)}
                    aria-label={t("speakWord")}
                  >
                    <Volume2 size={16} /> {t("speakWord")}
                  </button>
                </div>
              )}

              {studyMode === "quiz" && (
                <div style={styles.practiceWrap}>
                  {marks[current.id] && (
                    <div style={styles.reviewedTagStatic}>
                      {marks[current.id] === "know" ? t("alreadyKnownTag") : t("markedReviewTag")}
                    </div>
                  )}
                  <button
                    className="kv-btn"
                    style={styles.speakBtnInline}
                    onClick={() => speak(current.hangul)}
                    aria-label={t("speakWord")}
                  >
                    <Volume2 size={16} />
                  </button>
                  <div style={styles.hangul}>{current.hangul}</div>
                  <div style={styles.romanization}>{current.romanization}</div>
                  <div style={styles.practicePrompt}>{t("quizPrompt")}</div>
                  <div style={styles.quizOptionsWrap}>
                    {quizOptions.map((opt) => {
                      const isWrong = quizWrongIds.has(opt.id);
                      return (
                        <button
                          key={opt.id}
                          disabled={isWrong}
                          className="kv-btn"
                          onClick={() => selectQuizOption(opt)}
                          style={{ ...styles.quizOptionBtn, ...(isWrong ? styles.quizOptionWrong : {}) }}
                        >
                          {opt.text}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              <div style={styles.navRow}>
                <button
                  className="kv-btn"
                  style={{ ...styles.navArrowBtn, opacity: position === 0 ? 0.35 : 1 }}
                  onClick={goPrev}
                  disabled={position === 0}
                >
                  {t("prevBtn")}
                </button>
                <div style={styles.queueHint}>
                  {position + 1} / {roundTotal}
                </div>
                <button className="kv-btn" style={styles.navArrowBtn} onClick={goNext}>
                  {t("nextBtn")}
                </button>
              </div>
              <div style={styles.navSubHint}>{t("navSubHint")}</div>

              {studyMode === "flashcard" && (
                <div style={styles.actionRow}>
                  <button className="kv-btn" style={styles.btnReview} onClick={() => mark("review")}>
                    {t("reviewBtn")}
                  </button>
                  <button className="kv-btn" style={styles.btnKnow} onClick={() => mark("know")}>
                    {t("knowBtn")}
                  </button>
                </div>
              )}
            </>
          ) : null}
        </div>
      )}

      {view === "browse" && (
        <div style={{ ...styles.body, ...styles.browseBody }} className="kv-scroll">
          {allCategories.map((c) => {
            const words = allWords.filter((w) => w.category === c.id);
            if (!words.length) return null;
            return (
              <div key={c.id} style={styles.browseGroup}>
                <div style={styles.browseGroupTitle}>
                  {c.label} <span style={styles.browseGroupSub}>{catSub(c.id)}</span>
                </div>
                {words.map((w) => {
                  const st = progress[w.id]?.status;
                  return (
                    <div key={w.id} style={styles.browseRow}>
                      <button
                        className="kv-btn"
                        style={styles.rowSpeakBtn}
                        onClick={() => speak(w.hangul)}
                        aria-label="발음 듣기"
                      >
                        <Volume2 size={14} />
                      </button>
                      <div style={styles.browseHangul}>{w.hangul}</div>
                      <div style={styles.browseMeaning}>{meaningOf(w)}</div>
                      <div
                        style={{
                          ...styles.browseStatus,
                          color: st === "know" ? "#7FA189" : st === "review" ? "#A8412F" : "#5B6472",
                        }}
                      >
                        {st === "know" ? t("knownLabel") : st === "review" ? t("reviewLabel") : t("newLabel")}
                        {progress[w.id]?.mistakes > 0 && (
                          <div style={styles.browseMistake}>{t("mistakesBadge")(progress[w.id].mistakes)}</div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}

      {view === "add" && (
        <div style={{ ...styles.body, ...styles.browseBody }} className="kv-scroll">
          <form onSubmit={submitWord} style={styles.form}>
            <label style={styles.label}>{t("formCategory")}</label>
            <select
              value={form.category}
              onChange={(e) => setForm((f) => ({ ...f, category: e.target.value }))}
              style={styles.input}
            >
              {allCategories.map((c) => (
                <option key={c.id} value={c.id}>
                  {c.label} — {catSub(c.id)}
                </option>
              ))}
              <option value="__new__">{t("formNewCategoryOption")}</option>
            </select>

            {form.category === "__new__" && (
              <>
                <label style={styles.label}>{t("formNewCategoryLabel")}</label>
                <input
                  value={newCategoryName}
                  onChange={(e) => setNewCategoryName(e.target.value)}
                  style={styles.input}
                  placeholder={t("formNewCategoryPlaceholder")}
                />
              </>
            )}

            <label style={styles.label}>{t("formHangul")}</label>
            <input
              value={form.hangul}
              onChange={(e) => setForm((f) => ({ ...f, hangul: e.target.value }))}
              style={styles.input}
              placeholder="예: 아쉽다"
            />

            <label style={styles.label}>{t("formRoman")}</label>
            <input
              value={form.romanization}
              onChange={(e) => setForm((f) => ({ ...f, romanization: e.target.value }))}
              style={styles.input}
              placeholder="예: aswipda"
            />

            <label style={styles.label}>{t("formMeaningVi")}</label>
            <input
              value={form.meaning}
              onChange={(e) => setForm((f) => ({ ...f, meaning: e.target.value }))}
              style={styles.input}
              placeholder="예: tiếc nuối"
            />

            <label style={styles.label}>{t("formMeaningEn")}</label>
            <input
              value={form.meaningEn}
              onChange={(e) => setForm((f) => ({ ...f, meaningEn: e.target.value }))}
              style={styles.input}
              placeholder="e.g. to feel regretful"
            />

            <label style={styles.label}>{t("formExample")}</label>
            <input
              value={form.example}
              onChange={(e) => setForm((f) => ({ ...f, example: e.target.value }))}
              style={styles.input}
              placeholder="예문을 입력하세요"
            />

            <label style={styles.label}>{t("formExampleMeaningVi")}</label>
            <input
              value={form.exampleMeaning}
              onChange={(e) => setForm((f) => ({ ...f, exampleMeaning: e.target.value }))}
              style={styles.input}
              placeholder="예문 번역 (tiếng Việt)"
            />

            <label style={styles.label}>{t("formExampleMeaningEn")}</label>
            <input
              value={form.exampleMeaningEn}
              onChange={(e) => setForm((f) => ({ ...f, exampleMeaningEn: e.target.value }))}
              style={styles.input}
              placeholder="Example translation (English)"
            />

            <button type="submit" className="kv-btn" style={styles.submitBtn}>
              {t("submitBtn")}
            </button>
          </form>
          {customWords.length > 0 && (
            <div style={{ marginTop: 24 }}>
              <div style={styles.browseGroupTitle}>{t("myWordsTitle")}</div>
              {customWords.map((w) => (
                <div key={w.id} style={styles.browseRow}>
                  <div style={styles.browseHangul}>{w.hangul}</div>
                  <div style={styles.browseMeaning}>{meaningOf(w)}</div>
                  <div style={styles.browseStatus}>{catLabel(w.category)}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}
